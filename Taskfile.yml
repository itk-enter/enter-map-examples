version: '3'

tasks:
  serve:
    desc: Serve the demo on http://localhost:8088/enter-map-examples/, the same path as on GitHub Pages
    cmd: bin/serve.py 8088

  open:
    desc: Open the demo page in a browser
    cmd: open 'http://localhost:8088/enter-map-examples/'

  route:key:
    desc: Write the Septima routing key from .env into public/config/key.json
    cmd: bin/route-key.sh

  data:fetch:
    desc: Refresh the parking and dog forest snapshot from the Enter instance configured in .env
    cmd: bin/fetch-data.sh

  data:fetch-sources:
    desc: Refresh the bench and toilet snapshot from the Enter sources in ENTER_SOURCES
    cmd: bin/fetch-sources.sh
